<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${contacto.id != null} ? 'Editar Contacto — Práctica 14' : 'Nuevo Contacto — Práctica 14'">Formulario Contacto</title>
    <style>
        :root {
            --primary: #1A365D;
            --primary-light: #2B6CB0;
            --bg-color: #F7FAFC;
            --card-bg: #FFFFFF;
            --text-dark: #2D3748;
            --text-muted: #718096;
            --border: #CBD5E0;
            --focus-ring: rgba(66, 153, 225, 0.5);
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-dark);
            margin: 0;
            padding: 40px 20px;
        }

        .container {
            max-width: 550px;
            margin: 0 auto;
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1), 0 2px 4px -1px rgba(0,0,0,0.06);
            padding: 30px 35px;
            border: 1px solid var(--border);
        }

        h2 {
            margin-top: 0;
            margin-bottom: 8px;
            color: var(--primary);
            font-size: 24px;
        }

        p.subtitle {
            margin-top: 0;
            margin-bottom: 25px;
            color: var(--text-muted);
            font-size: 14px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-dark);
        }

        input[type="text"],
        input[type="email"],
        input[type="tel"] {
            width: 100%;
            padding: 10px 14px;
            border: 1px solid var(--border);
            border-radius: 6px;
            font-size: 15px;
            box-sizing: border-box;
            transition: all 0.2s ease;
            outline: none;
        }

        input:focus {
            border-color: var(--primary-light);
            box-shadow: 0 0 0 3px var(--focus-ring);
        }

        .btn-group {
            display: flex;
            gap: 12px;
            margin-top: 30px;
        }

        .btn {
            flex: 1;
            padding: 11px 18px;
            border-radius: 6px;
            font-weight: 600;
            font-size: 15px;
            cursor: pointer;
            text-align: center;
            text-decoration: none;
            border: none;
            transition: all 0.2s;
        }

        .btn-submit {
            background-color: var(--primary-light);
            color: #FFFFFF;
        }

        .btn-submit:hover {
            background-color: var(--primary);
        }

        .btn-cancel {
            background-color: #EDF2F7;
            color: var(--text-dark);
            border: 1px solid var(--border);
        }

        .btn-cancel:hover {
            background-color: #E2E8F0;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="card">
        <h2 th:text="${contacto.id != null} ? '✏️ Editar Contacto' : '📋 Nuevo Contacto'">Captura de Contacto</h2>
        <p class="subtitle" th:text="${contacto.id != null} ? 'Modifica los campos necesarios y guarda los cambios.' : 'Completa los datos para registrar un nuevo contacto en MySQL.'"></p>

        <form th:action="${contacto.id != null} ? @{/actualizar} : @{/guardar}" th:object="${contacto}" method="post">
            <!-- Campo oculto para mantener el ID al momento de actualizar -->
            <input type="hidden" th:field="*{id}" />

            <div class="form-group">
                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" th:field="*{nombre}" placeholder="Ej. Carlos" required autofocus />
            </div>

            <div class="form-group">
                <label for="apellido">Apellido:</label>
                <input type="text" id="apellido" th:field="*{apellido}" placeholder="Ej. González" required />
            </div>

            <div class="form-group">
                <label for="email">Correo Electrónico:</label>
                <input type="email" id="email" th:field="*{email}" placeholder="ejemplo@uanl.edu.mx" required />
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" th:field="*{telefono}" placeholder="Ej. 8112345678" required />
            </div>

            <div class="btn-group">
                <button type="submit" class="btn btn-submit" th:text="${contacto.id != null} ? '💾 Guardar Cambios' : '➕ Guardar Contacto'">Guardar</button>
                <a th:href="@{/contactos}" class="btn btn-cancel">Cancelar</a>
            </div>
        </form>
    </div>
</div>

</body>
</html>
