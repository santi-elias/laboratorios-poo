# Servidor Web
server.port=8080

# Conexión a Base de Datos MySQL / MariaDB
spring.datasource.url=jdbc:mysql://localhost:3306/agenda?useSSL=false&serverTimezone=America/Monterrey&allowPublicKeyRetrieval=true
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=root
spring.datasource.password=root

# Configuración JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Desactivar caché de plantillas Thymeleaf durante desarrollo
spring.thymeleaf.cache=false
