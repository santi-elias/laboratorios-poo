<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Hola Mundo - Spring Boot</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            margin-top: 80px;
            background-color: #1a1a2e;
            color: #e0e0e0;
        }
        h1 {
            color: #f0c040;
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        h2 {
            color: #4a90d9;
            margin-top: 0;
            font-size: 1.8em;
        }
        p {
            font-size: 1.2em;
        }
        .caja {
            display: inline-block;
            border: 2px solid #4a90d9;
            border-radius: 12px;
            padding: 30px 60px;
            margin-top: 20px;
            background-color: #16213e;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
        }
        .enlace {
            display: inline-block;
            margin-top: 25px;
            color: #4a90d9;
            text-decoration: none;
            font-size: 1em;
            font-weight: bold;
        }
        .enlace:hover {
            color: #f0c040;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div class="caja">
        <h1 th:text="${mensaje}">¡Hola Mundo desde Spring Boot!</h1>
        <h2 th:text="${gremio}">Gran Gremio de Aventureros</h2>
        <p>Nivel del gremio: <strong th:text="${nivel}">1</strong></p>
        <p><a href="/aventurero" class="enlace">Ver Ficha del Aventurero &rarr;</a></p>
    </div>
</body>
</html>
